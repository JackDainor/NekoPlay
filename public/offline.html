<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ff6b9d" />
  <title>Sin conexión — NekoPlay</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, sans-serif; background: #12081a; color: #fff5fa; text-align: center;
      padding: 1.5rem;
    }
    img { width: 96px; height: 96px; border-radius: 50%; border: 2px solid #ff6b9d; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; color: #ff6b9d; }
    p { color: #c9a0b8; max-width: 20rem; line-height: 1.5; }
    button {
      margin-top: 1.25rem; border: none; border-radius: 999px; padding: 0.75rem 1.4rem;
      background: linear-gradient(135deg, #c84bff, #ff6b9d); color: #1a0a14; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <div>
    <img src="/logo.svg" alt="NekoPlay" />
    <h1>Sin conexión</h1>
    <p>NekoPlay necesita internet para el catálogo y los pagos. Revisa tu red e intenta de nuevo.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
